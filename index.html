<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KompuDoc</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="card">
    <div class="brand">
      <h1>Kompu<span>Doc</span></h1>
      <p>Konsultasi dan troubleshooting komputer online</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nama@email.com" autocomplete="email">
        <small class="err" id="emailErr"></small>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="username" autocomplete="username">
        <small class="err" id="usernameErr"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle">Lihat</button>
        </div>
        <small class="err" id="passwordErr"></small>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
